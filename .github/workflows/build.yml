# 自动验收：服务端全套测试 + 编译安卓和 iOS App。
# 每次 PR 和手动触发（Actions 页面 → 验收与编译 → Run workflow）时运行。
# 编好的安装包在本次运行页面底部的 Artifacts 里下载。
name: 验收与编译

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  # 不取消进行中的编译：iOS 一次要 20 分钟，频繁推送时宁可排队
  cancel-in-progress: false

jobs:
  server:
    name: 服务端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 初始化并启动
        working-directory: deploy
        run: |
          python3 manage.py init --domain chat.test --dev
          docker compose --profile dev up -d --wait --wait-timeout 300 || true
          docker compose ps
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 接口 + 网页注册测试
        working-directory: deploy
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          for i in $(seq 1 60); do
            curl -skf --resolve matrix.chat.test:443:127.0.0.1 https://matrix.chat.test/_matrix/client/versions >/dev/null && break
            sleep 5
          done
          ./tests/run_local.sh
      - name: 失败时导出日志
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail 200

  android:
    name: 安卓
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: 取服务器地址和证书
        env:
          SERVER_HOST: ${{ secrets.HK177_SSH_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: clients/ci-server-config.sh
      - name: 生成源码
        run: |
          pip3 install --quiet pillow
          python3 clients/android/prepare.py
      - name: 编译
        working-directory: clients/android/build/element-x-android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx4g
        run: ./gradlew :app:assembleFdroidDebug --no-configuration-cache
      - uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: clients/android/build/element-x-android/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS（模拟器版）
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: 选用最新 Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: 安装 xcodegen
        run: brew install xcodegen
      - name: 取服务器地址和证书
        env:
          SERVER_HOST: ${{ secrets.HK177_SSH_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: clients/ci-server-config.sh
      - name: 生成源码
        run: python3 clients/ios/prepare.py
      - name: 编译
        working-directory: clients/ios/build/element-x-ios
        run: |
          xcodegen
          # 编译中间文件放仓库外，否则项目自带的 SwiftFormat 检查会去扫第三方依赖而报错
          # Rust SDK 的模拟器库只有 arm64（Apple 芯片），不编 x86_64
          xcodebuild build -project ElementX.xcodeproj -scheme ElementX -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1 && status=0 || status=$?
          # 日志很长，只打印报错和结尾，完整日志作为附件上传
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -80 || true
          tail -30 "$RUNNER_TEMP/xcodebuild.log"
          exit $status
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log
      - name: 打包
        run: |
          cd "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator"
          ditto -c -k --keepParent *.app "$GITHUB_WORKSPACE/ios-simulator-app.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: ios-simulator-app
          path: |
            ios-simulator-app.zip
            clients/ca.pem
          if-no-files-found: warn
